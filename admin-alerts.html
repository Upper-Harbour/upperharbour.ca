<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Upper Harbour</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06090E;
      --surface: #0C1219;
      --surface-2: #111A24;
      --teal: #3CB8B0;
      --teal-dim: rgba(60,184,176,0.08);
      --teal-border: rgba(60,184,176,0.22);
      --gold: #C9A84C;
      --gold-dim: rgba(201,168,76,0.08);
      --gold-border: rgba(201,168,76,0.3);
      --red: #E06050;
      --red-dim: rgba(224,96,80,0.08);
      --red-border: rgba(224,96,80,0.3);
      --violet: #9B6BFF;
      --violet-dim: rgba(155,107,255,0.10);
      --violet-border: rgba(155,107,255,0.32);
      --ice: #EAF0F4;
      --slate: #8A9DB0;
      --muted: #566778;
      --border: rgba(234,240,244,0.06);
      --border-md: rgba(234,240,244,0.1);
      --display: 'Newsreader', Georgia, serif;
      --body: 'DM Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--body); background: var(--bg); color: var(--ice); line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 52px; height: 66px; background: rgba(6,9,14,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-upper { font-size: 17px; font-weight: 400; color: var(--slate); }
    .nav-harbour { font-size: 17px; font-weight: 800; color: var(--ice); letter-spacing: -0.8px; margin-left: 4px; }
    .nav-divider { width: 1px; height: 18px; background: var(--border-md); margin: 0 14px; }
    .nav-sub { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-signout { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px 10px; text-transform: uppercase; }
    .nav-signout:hover { color: var(--ice); }

    .layout { max-width: 1100px; margin: 0 auto; padding: 120px 32px 80px; }

    /* Auth gate */
    .gate { max-width: 440px; margin: 40px auto 0; background: var(--surface); border: 1px solid var(--border-md); border-radius: 6px; padding: 36px 32px; }
    .gate .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .gate h1 { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--ice); line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.4px; }
    .gate p { font-size: 14px; color: var(--slate); margin-bottom: 22px; }
    .gate label { display: block; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .gate input { width: 100%; background: var(--bg); border: 1px solid var(--border-md); color: var(--ice); font-family: var(--mono); font-size: 14px; padding: 12px 14px; border-radius: 4px; outline: none; transition: border-color 0.15s; }
    .gate input:focus { border-color: var(--teal); }
    .gate button { margin-top: 18px; width: 100%; background: var(--teal); color: var(--bg); font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 13px 16px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; }
    .gate button:hover { opacity: 0.9; }
    .gate button:disabled { opacity: 0.5; cursor: not-allowed; }
    .gate .error { margin-top: 14px; font-size: 13px; color: var(--red); font-family: var(--mono); }

    /* Header */
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
    .page-header .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .page-header h1 { font-family: var(--display); font-size: 32px; font-weight: 700; color: var(--ice); line-height: 1.15; letter-spacing: -0.5px; }
    .page-header .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }

    /* Summary row */
    .summary { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border-md); border-radius: 4px; padding: 12px 16px; min-width: 120px; }
    .stat-label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .stat-value { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--ice); }
    .stat.pending { border-color: var(--gold-border); background: var(--gold-dim); }
    .stat.pending .stat-value { color: var(--gold); }
    .stat.approved .stat-value { color: var(--teal); }
    .stat.dismissed .stat-value { color: var(--slate); }

    /* Filters */
    .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); background: var(--surface); border: 1px solid var(--border-md); border-radius: 4px; padding: 8px 14px; cursor: pointer; transition: all 0.15s; }
    .filter:hover { color: var(--ice); border-color: var(--border-md); }
    .filter.active { color: var(--teal); border-color: var(--teal-border); background: var(--teal-dim); }

    /* Alert cards */
    .alerts { display: flex; flex-direction: column; gap: 14px; }
    .alert { background: var(--surface); border: 1px solid var(--border-md); border-radius: 6px; padding: 22px 24px; transition: border-color 0.15s; }
    .alert.status-pending_review { border-left: 3px solid var(--gold); }
    .alert.status-approved { border-left: 3px solid var(--teal); opacity: 0.6; }
    .alert.status-dismissed { border-left: 3px solid var(--muted); opacity: 0.45; }
    .alert.status-applied { border-left: 3px solid var(--teal); opacity: 0.45; }
    .alert.status-failed { border-left: 3px solid var(--red); }
    .alert.status-deferred { border-left: 3px solid var(--violet); opacity: 0.6; }
    .alert.status-accepted_for_research { border-left: 3px solid var(--violet); }
    .alert.status-researched_added { border-left: 3px solid var(--teal); opacity: 0.5; }
    .alert.status-researched_rejected { border-left: 3px solid var(--muted); opacity: 0.4; }

    /* Suggestion cards (change="suggest_new_tool") get a distinct violet
       treatment overlaid on top of the status colour. The status border
       still indicates the lifecycle stage (pending vs accepted vs researched);
       the violet ribbon below the header signals "this is a tool we don't
       track yet" so Josh can scan for them. */
    .alert.is-suggestion { background: linear-gradient(180deg, rgba(155,107,255,0.04) 0%, var(--surface) 80px); }
    .alert.is-suggestion .suggestion-ribbon {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--violet); background: var(--violet-dim);
      border: 1px solid var(--violet-border); border-radius: 3px;
      padding: 4px 10px; margin-bottom: 14px;
    }
    .alert:not(.is-suggestion) .suggestion-ribbon { display: none; }
    .suggestion-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin-bottom: 14px; padding: 12px 14px; background: var(--bg); border-radius: 4px; border: 1px solid var(--border); }
    .suggestion-meta .label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: start; padding-top: 2px; }
    .suggestion-meta .value { color: var(--ice); line-height: 1.5; }
    .suggestion-meta .value.empty { color: var(--muted); font-style: italic; }
    .suggestion-rationale { font-size: 13px; color: var(--slate); margin-bottom: 14px; padding: 12px 14px; background: var(--bg); border-radius: 4px; border-left: 2px solid var(--violet); }
    .suggestion-rationale .label { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet); margin-bottom: 6px; display: block; }

    .alert-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .alert-tool { font-family: var(--display); font-size: 19px; font-weight: 700; color: var(--ice); letter-spacing: -0.2px; }
    .alert-status { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
    .alert-status.status-pending_review { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); }
    .alert-status.status-approved { background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal-border); }
    .alert-status.status-dismissed { background: rgba(138,157,176,0.08); color: var(--slate); border: 1px solid var(--border-md); }
    .alert-status.status-applied { background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal-border); }
    .alert-status.status-failed { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-border); }
    .alert-status.status-deferred { background: var(--violet-dim); color: var(--violet); border: 1px solid var(--violet-border); }
    .alert-status.status-accepted_for_research { background: var(--violet-dim); color: var(--violet); border: 1px solid var(--violet-border); }
    .alert-status.status-researched_added { background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal-border); }
    .alert-status.status-researched_rejected { background: rgba(138,157,176,0.08); color: var(--slate); border: 1px solid var(--border-md); }

    .alert-change { display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .alert-diff { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin-bottom: 14px; }
    .alert-diff .label { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); align-self: start; padding-top: 2px; }
    .alert-diff .value { color: var(--ice); line-height: 1.5; }
    .alert-diff .value.old { color: var(--slate); text-decoration: line-through; text-decoration-color: var(--muted); }
    .alert-reason { font-size: 13px; color: var(--slate); margin-bottom: 14px; padding: 12px 14px; background: var(--bg); border-radius: 4px; border: 1px solid var(--border); }
    .alert-source { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
    .alert-source a { color: var(--teal); text-decoration: none; }
    .alert-source a:hover { text-decoration: underline; }

    .alert-actions { display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border); }
    .btn { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 18px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; transition: all 0.15s; background: none; }
    .btn-approve { color: var(--teal); border-color: var(--teal-border); background: var(--teal-dim); }
    .btn-approve:hover { background: var(--teal); color: var(--bg); }
    .btn-research { color: var(--violet); border-color: var(--violet-border); background: var(--violet-dim); }
    .btn-research:hover { background: var(--violet); color: var(--bg); }
    .btn-dismiss { color: var(--slate); border-color: var(--border-md); }
    .btn-dismiss:hover { color: var(--ice); border-color: var(--red-border); background: var(--red-dim); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty { text-align: center; padding: 80px 32px; color: var(--muted); font-family: var(--mono); font-size: 13px; letter-spacing: 0.05em; }
    .loading { text-align: center; padding: 80px 32px; color: var(--slate); font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; }

    .toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface-2); border: 1px solid var(--teal-border); border-radius: 4px; padding: 14px 20px; font-family: var(--mono); font-size: 12px; color: var(--ice); box-shadow: 0 8px 24px rgba(0,0,0,0.4); max-width: 360px; z-index: 200; }
    .toast.error { border-color: var(--red-border); color: var(--red); }

    .hidden { display: none !important; }

    @media(max-width:768px) {
      nav { padding: 0 16px; }
      .layout { padding: 100px 16px 60px; }
      .page-header h1 { font-size: 24px; }
      .alert { padding: 18px; }
      .alert-diff { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <svg width="28" height="28" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M 0,0 L 80,0 L 80,54 Q 80,80 54,80 L 26,80 Q 0,80 0,54 Z M 20,0 L 60,0 L 60,48 Q 60,64 40,64 Q 20,64 20,48 Z" fill="#EAF0F4" fill-rule="evenodd"/>
        <path d="M 20,17 L 33,28 L 60,10 L 60,48 Q 60,64 40,64 Q 20,64 20,48 Z" fill="#3CB8B0"/>
      </svg>
      <span style="display:inline-flex;align-items:baseline;gap:0"><span class="nav-upper">Upper</span><span class="nav-harbour">Harbour</span></span>
      <span class="nav-divider"></span>
      <span class="nav-sub">Pipeline Admin</span>
    </a>
    <div class="nav-right">
      <button class="nav-signout hidden" id="signout">Sign out</button>
    </div>
  </nav>

  <div class="layout">
    <div class="gate" id="gate">
      <div class="eyebrow">Pipeline Admin</div>
      <h1>Sign in.</h1>
      <p>Enter your admin key to review pending database alerts.</p>
      <label for="admin-key">Admin Key</label>
      <input type="password" id="admin-key" autocomplete="off" autofocus />
      <button id="signin">Unlock</button>
      <div class="error hidden" id="gate-error"></div>
    </div>

    <div class="admin hidden" id="admin">
      <div class="page-header">
        <div>
          <div class="eyebrow">Pipeline Admin</div>
          <h1>Database alerts</h1>
        </div>
        <div class="meta" id="updated-at"></div>
      </div>

      <div class="summary" id="summary"></div>

      <div class="filters" id="filters">
        <button class="filter active" data-filter="pending_review">Pending</button>
        <button class="filter" data-filter="accepted_for_research">To Research</button>
        <button class="filter" data-filter="all">All</button>
        <button class="filter" data-filter="approved">Approved</button>
        <button class="filter" data-filter="dismissed">Dismissed</button>
        <button class="filter" data-filter="applied">Applied</button>
      </div>

      <div class="loading" id="loading">Loading alerts&hellip;</div>
      <div class="alerts hidden" id="alerts"></div>
      <div class="empty hidden" id="empty">No alerts in this view.</div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

<script>
(function() {
  'use strict';

  var API_BASE = 'https://web-production-b1856.up.railway.app';
  var STORAGE_KEY = 'uh_admin_key';

  var adminKey = null;
  var allAlerts = [];
  var currentFilter = 'pending_review';

  function $(id) { return document.getElementById(id); }
  var gate = $('gate');
  var gateError = $('gate-error');
  var admin = $('admin');
  var keyInput = $('admin-key');
  var signinBtn = $('signin');
  var signoutBtn = $('signout');
  var loading = $('loading');
  var alertsEl = $('alerts');
  var emptyEl = $('empty');
  var summaryEl = $('summary');
  var updatedAt = $('updated-at');
  var filtersEl = $('filters');
  var toast = $('toast');

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.remove('hidden');
    setTimeout(function(){ toast.classList.add('hidden'); }, 3500);
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleString('en-CA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return iso;
    }
  }

  function apiCall(path, method) {
    return fetch(API_BASE + path, {
      method: method || 'GET',
      headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json' }
    }).then(function(res) {
      return res.json().catch(function(){ return {}; }).then(function(data) {
        if (!res.ok) {
          var err = new Error(data.error || 'Request failed (' + res.status + ')');
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function loadAlerts() {
    loading.classList.remove('hidden');
    alertsEl.classList.add('hidden');
    emptyEl.classList.add('hidden');
    apiCall('/api/admin/alerts').then(function(data) {
      allAlerts = data.alerts || [];
      renderSummary(data.counts || {}, data.total || 0);
      if (data.updated) updatedAt.textContent = 'Updated ' + formatDate(data.updated);
      render();
    }).catch(function(e) {
      loading.textContent = 'Failed to load alerts: ' + e.message;
      if (e.status === 401) setTimeout(signOut, 1500);
    });
  }

  // Map of UI action → API endpoint suffix.
  // The action names are what data-action values are on the buttons.
  var ACTION_ENDPOINTS = {
    'approve': 'approve',
    'dismiss': 'dismiss',
    'mark-researched': 'mark-researched',
    'mark-rejected': 'mark-rejected'
  };

  function setStatus(alertId, action) {
    var endpoint = ACTION_ENDPOINTS[action];
    if (!endpoint) {
      showToast('Unknown action: ' + action, true);
      return;
    }
    // Disable both action buttons on this card while the request is in flight
    var cardButtons = document.querySelectorAll('.btn[data-id="' + alertId + '"]');
    for (var i = 0; i < cardButtons.length; i++) cardButtons[i].disabled = true;

    apiCall('/api/admin/alerts/' + encodeURIComponent(alertId) + '/' + endpoint, 'POST').then(function(data) {
      var label = (
        action === 'approve' ? '\u2713 Approved' :
        action === 'dismiss' ? '\u2713 Dismissed' :
        action === 'mark-researched' ? '\u2713 Marked researched & added' :
        action === 'mark-rejected' ? '\u2713 Marked researched & rejected' :
        '\u2713 Updated'
      );
      showToast(label + ': ' + (data.tool_name || alertId));
      var target = null;
      for (var i = 0; i < allAlerts.length; i++) {
        if (allAlerts[i].id === alertId) { target = allAlerts[i]; break; }
      }
      if (target) target.status = data.newStatus;
      recomputeCounts();
      render();
    }).catch(function(e) {
      showToast('Error: ' + e.message, true);
      for (var i = 0; i < cardButtons.length; i++) cardButtons[i].disabled = false;
    });
  }

  function recomputeCounts() {
    var counts = {};
    allAlerts.forEach(function(a){ counts[a.status] = (counts[a.status] || 0) + 1; });
    renderSummary(counts, allAlerts.length);
  }

  function renderSummary(counts, total) {
    var html = '<div class="stat"><div class="stat-label">Total</div><div class="stat-value">' + total + '</div></div>';
    var order = [
      ['pending_review', 'Pending', 'pending'],
      ['accepted_for_research', 'To Research', 'accepted_for_research'],
      ['approved', 'Approved', 'approved'],
      ['dismissed', 'Dismissed', 'dismissed'],
      ['applied', 'Applied', '']
    ];
    for (var i = 0; i < order.length; i++) {
      var key = order[i][0], label = order[i][1], cls = order[i][2];
      var n = counts[key] || 0;
      html += '<div class="stat ' + cls + '"><div class="stat-label">' + label + '</div><div class="stat-value">' + n + '</div></div>';
    }
    summaryEl.innerHTML = html;
  }

  // Try to parse the new_value field as the JSON metadata blob the
  // signals/tripwire pipelines emit for suggest_new_tool alerts. Returns
  // null if parsing fails or the field doesn't look like a suggestion blob.
  function parseSuggestionMeta(newValue) {
    if (!newValue || typeof newValue !== 'string') return null;
    var trimmed = newValue.trim();
    if (!trimmed.startsWith('{')) return null;
    try {
      var meta = JSON.parse(trimmed);
      if (!meta || typeof meta !== 'object') return null;
      return {
        parent: (meta.parent || '').toString(),
        jurisdiction: (meta.jurisdiction || '').toString(),
        category: (meta.category || '').toString(),
        rationale: (meta.rationale || '').toString()
      };
    } catch (e) {
      return null;
    }
  }

  function renderSuggestionCard(a) {
    var statusLabel = (a.status || 'unknown').replace(/_/g, ' ');
    var meta = parseSuggestionMeta(a.new_value) || { parent: '', jurisdiction: '', category: '', rationale: '' };

    var sourceLine = a.source_url
      ? '<a href="' + escapeHtml(a.source_url) + '" target="_blank" rel="noopener">Source</a>'
      : '';
    var headline = a.signal_headline ? '<span>' + escapeHtml(a.signal_headline) + '</span>' : '';
    var sigDate = a.signal_date ? '<span>' + escapeHtml(a.signal_date) + '</span>' : '';

    function metaRow(label, value) {
      var v = (value || '').trim();
      var cls = v ? 'value' : 'value empty';
      var display = v || '(unknown — Claude could not infer from the source)';
      return '<div class="label">' + label + '</div><div class="' + cls + '">' + escapeHtml(display) + '</div>';
    }

    // Action buttons differ by status:
    //  - pending_review        → "Mark for research" / "Dismiss"
    //  - accepted_for_research → "Researched & added" / "Researched & rejected"
    //  - terminal states       → no buttons
    var actions = '';
    if (a.status === 'pending_review' || a.status === 'pending') {
      actions = '<div class="alert-actions">'
        + '<button class="btn btn-research" data-action="approve" data-id="' + escapeHtml(a.id) + '">Mark for research</button>'
        + '<button class="btn btn-dismiss" data-action="dismiss" data-id="' + escapeHtml(a.id) + '">Dismiss</button>'
      + '</div>';
    } else if (a.status === 'accepted_for_research') {
      actions = '<div class="alert-actions">'
        + '<button class="btn btn-approve" data-action="mark-researched" data-id="' + escapeHtml(a.id) + '">Researched &amp; added</button>'
        + '<button class="btn btn-dismiss" data-action="mark-rejected" data-id="' + escapeHtml(a.id) + '">Researched &amp; rejected</button>'
      + '</div>';
    }

    return '<div class="alert is-suggestion status-' + escapeHtml(a.status) + '">'
      + '<div class="alert-header">'
        + '<div class="alert-tool">' + escapeHtml(a.tool_name || '(unknown tool)') + '</div>'
        + '<div class="alert-status status-' + escapeHtml(a.status) + '">' + escapeHtml(statusLabel) + '</div>'
      + '</div>'
      + '<div class="suggestion-ribbon">\u25C6 New tool suggestion</div>'
      + '<div class="suggestion-meta">'
        + metaRow('Parent', meta.parent)
        + metaRow('Jurisdiction', meta.jurisdiction)
        + metaRow('Category', meta.category)
      + '</div>'
      + (meta.rationale
          ? '<div class="suggestion-rationale"><span class="label">Why Claude flagged this</span>' + escapeHtml(meta.rationale) + '</div>'
          : '')
      + '<div class="alert-source">' + headline + sigDate + sourceLine + '</div>'
      + actions
    + '</div>';
  }

  function renderStandardCard(a) {
    var isPending = a.status === 'pending_review' || a.status === 'pending';
    var statusLabel = (a.status || 'unknown').replace(/_/g, ' ');
    var oldVal = a.old_value == null ? '(none)' : a.old_value;
    var newVal = a.new_value == null ? '(none)' : a.new_value;
    var sourceLine = a.source_url
      ? '<a href="' + escapeHtml(a.source_url) + '" target="_blank" rel="noopener">Source</a>'
      : '';
    var headline = a.signal_headline ? '<span>' + escapeHtml(a.signal_headline) + '</span>' : '';
    var sigDate = a.signal_date ? '<span>' + escapeHtml(a.signal_date) + '</span>' : '';

    return '<div class="alert status-' + escapeHtml(a.status) + '">'
      + '<div class="alert-header">'
        + '<div class="alert-tool">' + escapeHtml(a.tool_name || '(unknown tool)') + '</div>'
        + '<div class="alert-status status-' + escapeHtml(a.status) + '">' + escapeHtml(statusLabel) + '</div>'
      + '</div>'
      + '<div class="alert-change">' + escapeHtml((a.change || '').replace(/_/g, ' ')) + '</div>'
      + '<div class="alert-diff">'
        + '<div class="label">From</div><div class="value old">' + escapeHtml(oldVal) + '</div>'
        + '<div class="label">To</div><div class="value">' + escapeHtml(newVal) + '</div>'
      + '</div>'
      + (a.reason ? '<div class="alert-reason">' + escapeHtml(a.reason) + '</div>' : '')
      + '<div class="alert-source">' + headline + sigDate + sourceLine + '</div>'
      + (isPending
          ? '<div class="alert-actions">'
              + '<button class="btn btn-approve" data-action="approve" data-id="' + escapeHtml(a.id) + '">Approve</button>'
              + '<button class="btn btn-dismiss" data-action="dismiss" data-id="' + escapeHtml(a.id) + '">Dismiss</button>'
            + '</div>'
          : '')
    + '</div>';
  }

  function render() {
    loading.classList.add('hidden');
    var filtered = currentFilter === 'all'
      ? allAlerts.slice()
      : allAlerts.filter(function(a){ return a.status === currentFilter; });

    filtered.sort(function(a, b) {
      // Pending always at top, then accepted_for_research, then by recency
      var rank = function(status) {
        if (status === 'pending_review' || status === 'pending') return 0;
        if (status === 'accepted_for_research') return 1;
        return 2;
      };
      var ra = rank(a.status), rb = rank(b.status);
      if (ra !== rb) return ra - rb;
      return (b.flagged_at || '').localeCompare(a.flagged_at || '');
    });

    if (filtered.length === 0) {
      alertsEl.classList.add('hidden');
      emptyEl.classList.remove('hidden');
      return;
    }
    emptyEl.classList.add('hidden');
    alertsEl.classList.remove('hidden');

    var html = filtered.map(function(a) {
      if (a.change === 'suggest_new_tool') {
        return renderSuggestionCard(a);
      }
      return renderStandardCard(a);
    }).join('');
    alertsEl.innerHTML = html;

    var buttons = alertsEl.querySelectorAll('.btn');
    for (var i = 0; i < buttons.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          setStatus(btn.dataset.id, btn.dataset.action);
        });
      })(buttons[i]);
    }
  }

  function signIn() {
    var key = keyInput.value.trim();
    if (!key) { gateError.textContent = 'Enter a key.'; gateError.classList.remove('hidden'); return; }
    signinBtn.disabled = true;
    signinBtn.textContent = 'Checking\u2026';
    gateError.classList.add('hidden');
    adminKey = key;
    apiCall('/api/admin/alerts').then(function() {
      sessionStorage.setItem(STORAGE_KEY, key);
      gate.classList.add('hidden');
      admin.classList.remove('hidden');
      signoutBtn.classList.remove('hidden');
      loadAlerts();
    }).catch(function(e) {
      adminKey = null;
      gateError.textContent = e.status === 401 ? 'Invalid admin key.' : 'Sign-in failed: ' + e.message;
      gateError.classList.remove('hidden');
      signinBtn.disabled = false;
      signinBtn.textContent = 'Unlock';
    });
  }

  function signOut() {
    adminKey = null;
    sessionStorage.removeItem(STORAGE_KEY);
    gate.classList.remove('hidden');
    admin.classList.add('hidden');
    signoutBtn.classList.add('hidden');
    keyInput.value = '';
    signinBtn.disabled = false;
    signinBtn.textContent = 'Unlock';
    allAlerts = [];
  }

  signinBtn.addEventListener('click', signIn);
  signoutBtn.addEventListener('click', signOut);
  keyInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') signIn(); });

  var filterBtns = filtersEl.querySelectorAll('.filter');
  for (var i = 0; i < filterBtns.length; i++) {
    (function(f) {
      f.addEventListener('click', function() {
        for (var j = 0; j < filterBtns.length; j++) filterBtns[j].classList.remove('active');
        f.classList.add('active');
        currentFilter = f.dataset.filter;
        render();
      });
    })(filterBtns[i]);
  }

  var stored = sessionStorage.getItem(STORAGE_KEY);
  if (stored) {
    adminKey = stored;
    gate.classList.add('hidden');
    admin.classList.remove('hidden');
    signoutBtn.classList.remove('hidden');
    loadAlerts();
  }
})();
</script>
</body>
</html>
