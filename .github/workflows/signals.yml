# .github/workflows/signals.yml
# Runs the signals intelligence pipeline every 6 hours

name: Signals Pipeline

on:
  schedule:
    # Every 6 hours: midnight, 6am, noon, 6pm ET (UTC-5)
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic feedparser requests

      - name: Run signals pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
        run: python signals_pipeline.py collect

      - name: Commit pending signals
        run: |
          git config user.name "Signals Bot"
          git config user.email "bot@upperharbour.ca"
          git add pending.json signals.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "signals: $(date -u +%Y-%m-%dT%H:%M) — pipeline run"
          git push || true

  # Separate job for processing approval replies
  # This can be triggered manually or via webhook
  approve:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic feedparser requests

      - name: Process approvals
        run: |
          # This step would be customized based on how approvals come in
          # For email-based: parse reply and extract approved numbers
          # For now, provides manual approve-all option
          echo "Run manually: python signals_pipeline.py approve 1 2 3"
          echo "Or: python signals_pipeline.py approve-all"

      - name: Commit approved signals
        run: |
          git config user.name "Signals Bot"
          git config user.email "bot@upperharbour.ca"
          git add signals.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "signals: approved items published"
          git push || true
