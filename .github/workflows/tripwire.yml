name: Acquisition Tripwire

on:
  schedule:
    - cron: '0 12 * * *'  # Once daily at 7am ET (noon UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run acquisition tripwire
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APPROVAL_EMAIL: ${{ secrets.APPROVAL_EMAIL }}
          SIGNALS_JSON_PATH: signals.json
          SAAS_DB_PATH: assets/saas-db-public.json
        run: python acquisition_tripwire.py

      - name: Commit results
        run: |
          git config user.name "Tripwire Bot"
          git config user.email "bot@upperharbour.ca"
          git add -f signals.json db-alerts.json tripwire-cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "tripwire: $(date -u +%Y-%m-%d) — daily scan"
          git pull --rebase origin main || true
          git push || true
