name: Apply Approved DB Updates

'on':
  push:
    branches: [main]
    paths:
      - 'db-alerts.json'
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for approved alerts
        id: check
        run: |
          if [ ! -f db-alerts.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No db-alerts.json found"
            exit 0
          fi
          APPROVED=$(python3 -c "
          import json
          with open('db-alerts.json') as f:
            data = json.load(f)
          alerts = data.get('alerts', data) if isinstance(data, dict) else data
          count = sum(1 for a in alerts if isinstance(a, dict) and a.get('status') == 'approved')
          print(count)
          ")
          echo "approved=$APPROVED" >> $GITHUB_OUTPUT
          if [ "$APPROVED" = "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No approved alerts to process"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Found $APPROVED approved alert(s)"
          fi

      - name: Apply approved updates
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 apply_db_updates.py --apply
          echo "Updates applied to saas-db.js"

      - name: Update schema stats
        if: steps.check.outputs.skip != 'true'
        run: |
          python3 update-schema-stats.py
          echo "Schema stats updated across all HTML files"

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-apply approved DB updates + update schema stats [skip ci]"
            git pull --rebase origin main || true
            git push
            echo "Changes committed and pushed"
          fi
