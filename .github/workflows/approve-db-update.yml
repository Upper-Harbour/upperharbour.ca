# approve-db-update.yml
# Triggered when db-alerts.json is updated with approved alerts.
# Runs apply_db_updates.py to write changes to saas-db.js, then
# commits and pushes the result.

name: Apply Approved DB Updates

on:
  # Run when db-alerts.json changes on main (e.g. after manual approval)
  push:
    branches: [main]
    paths:
      - 'db-alerts.json'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

  # Also run on the same schedule as the signals pipeline (30 min after)
  # so approved alerts are picked up promptly
  schedule:
    - cron: '30 */6 * * *'   # every 6 hours, offset from pipeline

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for approved alerts
        id: check
        run: |
          if [ ! -f db-alerts.json ]; then
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "No db-alerts.json found"
            exit 0
          fi
          # Check if any alerts have status "approved"
          APPROVED=$(python3 -c "
          import json, sys
          data = json.load(open('db-alerts.json'))
          alerts = data.get('alerts', data) if isinstance(data, dict) else data
          count = sum(1 for a in alerts if a.get('status') == 'approved')
          print(count)
          ")
          echo "approved_count=$APPROVED" >> $GITHUB_OUTPUT
          if [ "$APPROVED" -gt 0 ]; then
            echo "has_approved=true" >> $GITHUB_OUTPUT
            echo "Found $APPROVED approved alert(s)"
          else
            echo "has_approved=false" >> $GITHUB_OUTPUT
            echo "No approved alerts to process"
          fi

      - name: Apply approved alerts to saas-db.js
        if: steps.check.outputs.has_approved == 'true'
        run: |
          python3 apply_db_updates.py --apply --commit

      - name: Summary
        if: always()
        run: |
          echo "### DB Update Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_approved }}" = "true" ]; then
            echo "✅ Processed ${{ steps.check.outputs.approved_count }} approved alert(s)" >> $GITHUB_STEP_SUMMARY
            echo "Changes committed to saas-db.js" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No approved alerts to process" >> $GITHUB_STEP_SUMMARY
          fi
